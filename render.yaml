services:
  - type: web
    name: aegis-telecom-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: AEGIS_ENV
        value: Production-Render
      - key: AEGIS_DATABASE_URL
        value: sqlite:///./aegis.db
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
