apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-ingress
  namespace: aegis-security
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: aegis.telecom.internal
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: aegis-backend-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aegis-frontend-svc
            port:
              number: 80
