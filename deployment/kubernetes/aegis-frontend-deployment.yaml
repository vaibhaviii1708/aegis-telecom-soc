apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-frontend
  namespace: aegis-security
  labels:
    app.kubernetes.io/name: aegis-frontend
    app.kubernetes.io/part-of: aegis-telecom-soc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-frontend
  template:
    metadata:
      labels:
        app: aegis-frontend
    spec:
      containers:
      - name: frontend-ui
        image: aegis/telecom-frontend:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http-web
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-frontend-svc
  namespace: aegis-security
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http-web
  selector:
    app: aegis-frontend
