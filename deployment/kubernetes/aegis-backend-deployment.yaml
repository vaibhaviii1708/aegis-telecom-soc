apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  namespace: aegis-security
  labels:
    app.kubernetes.io/name: aegis-backend
    app.kubernetes.io/part-of: aegis-telecom-soc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-backend
  template:
    metadata:
      labels:
        app: aegis-backend
    spec:
      containers:
      - name: backend-engine
        image: aegis/telecom-backend:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http-api
        envFrom:
        - configMapRef:
            name: aegis-config
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-backend-svc
  namespace: aegis-security
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http-api
  selector:
    app: aegis-backend
